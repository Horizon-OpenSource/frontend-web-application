<h2 mat-dialog-title>

  {{ data.titleKey | translate }}

</h2>


<mat-dialog-content>

  <p>
    {{
      data.messageKey
        | translate: { name: data.name }
    }}
  </p>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    {{ 'organization.actions.cancel' | translate }}

  </button>


  <button
    mat-flat-button
    type="button"
    (click)="confirm()">

    {{ data.confirmKey | translate }}

  </button>

</mat-dialog-actions>
